<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171719">

  <title>CREEPY. — A Little World for You</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #171719;
      color: #f5f0e8;
      font-family: Georgia, serif;
    }

    .hero {
      min-height: 100vh;
      padding: 36px 24px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      position: relative;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 2px;
      color: #d4b7c2;
    }

    .main {
      max-width: 440px;
      margin: 65px auto;
      width: 100%;
    }

    .eyebrow {
      color: #e6a9c0;
      font-family: Arial, sans-serif;
      font-size: 11px;
      letter-spacing: 3px;
      margin-bottom: 22px;
      text-transform: uppercase;
    }

    h1 {
      font-size: clamp(54px, 15vw, 84px);
      line-height: 0.95;
      font-weight: normal;
      letter-spacing: -4px;
    }

    h1 span {
      color: #e6a9c0;
      font-style: italic;
    }

    .description {
      color: #c3bdba;
      font-family: Arial, sans-serif;
      font-size: 14px;
      line-height: 1.9;
      margin-top: 28px;
      max-width: 320px;
    }

    .button {
      display: inline-block;
      border: 1px solid #e6a9c0;
      color: #f5f0e8;
      background: transparent;
      padding: 16px 21px;
      margin-top: 32px;
      font-size: 12px;
      letter-spacing: 1px;
      cursor: pointer;
      text-decoration: none;
      transition: 0.25s;
    }

    .button:hover {
      background: #e6a9c0;
      color: #171719;
    }

    .footer {
      color: #8c8587;
      font-family: Arial, sans-serif;
      font-size: 10px;
      letter-spacing: 1.5px;
      line-height: 2;
    }

    .decoration {
      position: absolute;
      right: -35px;
      bottom: 100px;
      font-size: 110px;
      opacity: 0.13;
      transform: rotate(-15deg);
      pointer-events: none;
    }
  </style>
</head>

<body>
  <main class="hero">
    <header class="top">
      <span>C. / PRIVATE LITTLE UNIVERSE</span>
      <span>EST. 2025</span>
    </header>

    <section class="main">
      <p class="eyebrow">A little something for you</p>

      <h1>CREEPY<span>.</span></h1>

      <p class="description">
        Out of all the random people on the internet,
        somehow, I found you.
        And now there's a little world here
        that belongs to you.
      </p>

      <button class="button" onclick="enterWorld()">
        ENTER YOUR LITTLE WORLD ↗
      </button>
    </section>

    <div class="decoration" aria-hidden="true">♡</div>

    <footer class="footer">
      MADE WITH A LITTLE TOO MUCH LOVE.<br>
      FOR ONE PARTICULAR CREEP.
    </footer>
  </main>

  <script>
    function enterWorld() {
      alert("Welcome to your little world, Creep. ♡");
    }
  </script>
</body>
</html>
